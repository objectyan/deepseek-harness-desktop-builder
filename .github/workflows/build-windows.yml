name: Build DeepSeek Harness Desktop (Windows)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: desktop-build-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      DSH_DESKTOP_APP_ID: com.objectyan.deepseek-harness
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          fetch-depth: 0

      - name: Resolve latest upstream tag
        id: meta
        shell: pwsh
        run: |
          $tag = (git tag --list 'dsh-v*' --sort=-version:refname | Select-Object -First 1).Trim()
          if (-not $tag) { throw 'No upstream dsh-v* tag was found.' }
          git checkout --detach $tag
          $sha = (git rev-parse HEAD).Trim()
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $version = $package.version
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Patch stale fs-ext smoke check
        shell: pwsh
        run: |
          $path = 'apps/desktop/tests/fixtures/runtime-payload-smoke.mjs'
          $text = Get-Content -Raw $path
          if (-not $text.Contains('  checkFsExt()')) {
            throw "Expected stale fs-ext smoke check was not found in $path"
          }
          $text = [regex]::Replace($text, '(?m)^\s*checkFsExt\(\)\r?\n', '')
          $text = $text.Replace('    fsExt: true, koffi: true, sharp: true, html: true, pty: true', '    koffi: true, sharp: true, html: true, pty: true')
          Set-Content -Path $path -Value $text -NoNewline

      - name: Check whether this revision is already released
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `upstream-${'${{ steps.meta.outputs.tag }}'}`;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setOutput('exists', 'true');
            } catch (error) {
              if (error.status === 404) core.setOutput('exists', 'false');
              else throw error;
            }

      - name: Stop when the current upstream revision is already published
        if: steps.release.outputs.exists == 'true'
        shell: pwsh
        run: Write-Host "Release for ${{ steps.meta.outputs.sha }} already exists."

      - name: Enable pnpm
        if: steps.release.outputs.exists != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        if: steps.release.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        if: steps.release.outputs.exists != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Windows x64 installer
        if: steps.release.outputs.exists != 'true'
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Create release
        if: steps.release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: upstream-${{ steps.meta.outputs.tag }}
          name: DeepSeek Harness ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.tag }})
          prerelease: true
          generate_release_notes: true
          body: |
            Automated unsigned Windows x64 build from deepseek-ai/deepseek-harness.

            Upstream commit: ${{ steps.meta.outputs.sha }}
            Upstream version: ${{ steps.meta.outputs.version }}
          files: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/**
